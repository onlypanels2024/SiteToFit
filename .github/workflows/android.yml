# Builds the SiteToFit Android app (the APK you install on the phone).
# Run it from the repository's "Actions" tab: choose "Android app", then "Run workflow".
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main, 'review/**']
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the app
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Keep the app file
        uses: actions/upload-artifact@v4
        with:
          name: SiteToFit-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
